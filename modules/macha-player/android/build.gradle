// `expo-module-gradle-plugin` applies the Android library and Kotlin plugins
// itself and wires the publishing component, so they are not applied here —
// applying them by hand configures publishing before the `release` component
// exists and the build fails looking for it.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'foundation.macha.player'
version = '0.1.0'

// Matches the phone client's version, so the two Macha native clients fail and
// get fixed together rather than diverging on ExoPlayer bugs.
// **The minimum this module needs, not what ships.** Gradle resolves a version
// conflict upward across modules, and `expo-video` asks for a higher one, so
// the APK carries the highest version any module requests (measured: 1.9.0,
// from expo-video). Read it from the build rather than from here:
//
//   grep -A3 -i media3 android/app/build/outputs/sdk-dependencies/release/sdkDependencies.txt
//
// The capability claims in `MachaPlayerModule.kt` are assertions about the
// linked media3, so they are checkable only against the resolved version.
def media3Version = '1.8.0'

android {
  namespace 'foundation.macha.player'
  defaultConfig {
    // Both are required: expo-autolinking reads versionName while configuring
    // the module, and omitting it fails the whole autolinking plugin.
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 24
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
}
