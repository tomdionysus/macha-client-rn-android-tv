// `expo-module-gradle-plugin` wires Kotlin and publishing itself; applying
// them by hand fails the build looking for the `release` component.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'foundation.macha.player'
version = '0.1.0'

// A minimum, matching the phone client; not what ships. Gradle resolves upward
// and expo-video asks for more (measured: 1.9.0). The resolved version is in
// android/app/build/outputs/sdk-dependencies/release/sdkDependencies.txt, and
// the capability claims in `MachaPlayerModule.kt` hold only against it.
def media3Version = '1.8.0'

android {
  namespace 'foundation.macha.player'
  defaultConfig {
    // expo-autolinking reads versionName; omitting it fails autolinking.
    versionCode 1
    versionName '0.1.0'
    minSdkVersion 24
  }
}

dependencies {
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-dash:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
}
